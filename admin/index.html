<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title>
<style>
:root{--ink:#16181d;--mut:#6b7280;--line:#e5e7eb;--bg:#f4f5f7;--pri:#111827;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box;margin:0;padding:0}body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:0}input,select,textarea{font:inherit}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:28px;border-radius:14px;box-shadow:0 4px 24px #0001}
#login h1{font-size:20px;margin-bottom:14px}
.layout{display:none;min-height:100vh}.layout.on{display:flex}
.side{width:220px;background:var(--pri);color:#cbd5e1;padding:16px 10px;flex:none;position:sticky;top:0;height:100vh;overflow:auto}
.side h2{color:#fff;font-size:15px;padding:6px 10px 16px;letter-spacing:.05em}
.side a{display:block;padding:10px 12px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer;margin-bottom:2px}.side a.on,.side a:hover{background:#ffffff1f;color:#fff}
.side .vs{margin-top:16px;border-top:1px solid #ffffff22;padding-top:12px}
.main{flex:1;padding:22px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}.top h1{font-size:22px}
.btn{background:var(--pri);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.red{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px #0001;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}.stat{background:#fff;padding:16px;border-radius:12px;box-shadow:0 1px 3px #0001}.stat b{display:block;font-size:24px;margin-top:2px}.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.tw{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 1px 3px #0001}table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;background:#fafafa}td img{width:40px;height:50px;object-fit:cover;border-radius:6px;background:#eee}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:#eef0f3;text-transform:uppercase}.pill.g{background:#dcfce7;color:var(--ok)}.pill.r{background:#fee2e2;color:var(--bad)}.pill.y{background:#fef3c7;color:#92400e}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:50}.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:620px;margin:auto}.mbox h2{margin-bottom:14px}
.f{margin-bottom:12px}.f label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:4px}.f input[type=text],.f input[type=number],.f input[type=date],.f input[type=password],.f input[type=email],.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
.f .hint{font-size:12px;color:var(--mut);margin-top:3px}.chk{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgs{display:flex;gap:8px;flex-wrap:wrap}.imgs div{position:relative}.imgs img{width:72px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.imgs button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font-size:12px}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:13px}.msg.e{background:#fee2e2;color:var(--bad)}.msg.o{background:#dcfce7;color:var(--ok)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:#fff;border:1px solid var(--line);padding:7px 14px;border-radius:20px}.tabs button.on{background:var(--pri);color:#fff}
.menu-btn{display:none}
@media(max-width:800px){.side{position:fixed;left:-240px;z-index:40;transition:.25s}.side.open{left:0}.menu-btn{display:inline-block}.main{padding:14px}.grid2{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><h1>🔐 Admin login</h1><div class="f"><label>Password</label><input type="password" id="pw" autofocus></div><div id="lmsg"></div><button class="btn" id="lbtn" style="width:100%">Log in</button></div>
<div class="layout" id="layout"><nav class="side" id="side"><h2 id="brand">ADMIN</h2><div id="nav"></div><div class="vs"><a href="/" target="_blank">↗ View store</a><a id="logout">Log out</a></div></nav><div class="main"><div class="top"><div><button class="btn sec menu-btn" id="mb">☰</button> <h1 id="title" style="display:inline"></h1></div><div id="actions"></div></div><div id="content"></div></div></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script src="admin.js"></script></body></html>
